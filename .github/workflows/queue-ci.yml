name: Queue CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-ci:
    name: queue-ci
    runs-on: ubuntu-latest

    steps:
      - name: Pass deterministic queue gate
        shell: bash
        run: |
          set -euo pipefail
          echo "Queue CI passed"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Commit: $GITHUB_SHA"
