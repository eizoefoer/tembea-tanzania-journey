name: Queue CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: queue-ci
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Fetch base branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch \
            --no-tags \
            origin \
            "${{ github.event.pull_request.base.ref }}" \
            --depth=1

      - name: Validate changed-file whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check \
            "origin/${{ github.event.pull_request.base.ref }}"...HEAD

      - name: Reject changed symlinks
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' path; do
            if [ -L "$path" ]; then
              echo "Changed symlinks are not permitted: $path"
              exit 1
            fi
          done < <(
            git diff \
              --name-only \
              -z \
              "origin/${{ github.event.pull_request.base.ref }}"...HEAD
          )

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run available repository checks
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail

          for script in lint test build; do
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['${script}'] ? 0 : 1)"; then
              echo "Running pnpm ${script}"
              pnpm run "${script}"
            else
              echo "No ${script} script; skipping"
            fi
          done

      - name: Show changed files
        shell: bash
        run: |
          set -euo pipefail
          git diff \
            --name-status \
            "origin/${{ github.event.pull_request.base.ref }}"...HEAD
