name: Queue CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: queue-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: queue-ci
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch \
            --no-tags \
            origin \
            "$BASE_REF" \
            --depth=1

      - name: Validate pull-request diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail

          git diff --check "origin/${BASE_REF}...HEAD"

          CHANGED_COUNT="$(
            git diff \
              --name-only \
              "origin/${BASE_REF}...HEAD" \
              | sed '/^$/d' \
              | wc -l
          )"

          if [ "$CHANGED_COUNT" -eq 0 ]; then
            echo "Pull request contains no changed files."
            exit 1
          fi

          echo "Validated changed files:"
          git diff \
            --name-status \
            "origin/${BASE_REF}...HEAD"

      - name: Reject changed symlinks
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' path; do
            if [ -L "$path" ]; then
              echo "Changed symlink is forbidden: $path"
              exit 1
            fi
          done < <(
            git diff \
              --name-only \
              -z \
              "origin/${BASE_REF}...HEAD"
          )
